name: Daily livestream URL to Telegram

# Explicit permissions help scheduled runs on repos with restrictive defaults.
permissions:
  contents: read

'on':
  workflow_dispatch:
  schedule:
    # Multiple UTC slots ≈ 5:00–9:50 IST to survive GitHub schedule jitter (free tier).
    # IST = UTC+5:30
    - cron: '30 23 * * *' # ~05:00 IST
    - cron: '15 0 * * *' # ~05:45 IST
    - cron: '0 1 * * *' # ~06:30 IST
    - cron: '45 1 * * *' # ~07:15 IST
    - cron: '30 2 * * *' # ~08:00 IST
    - cron: '15 3 * * *' # ~08:45 IST
    - cron: '0 4 * * *' # ~09:30 IST
    - cron: '20 4 * * *' # ~09:50 IST

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Show trigger (schedule vs manual)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: IST calendar date (cache key)
        id: istday
        run: echo "d=$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day notify state
        uses: actions/cache@v4
        with:
          path: livestream-state.json
          key: livestream-notify-${{ steps.istday.outputs.d }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve URL and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_URL: https://timeshealthplus.com/TH/livestream/KeshavKeshav21842
          TIMEOUT_MS: '90000'
          STATE_FILE: ${{ github.workspace }}/livestream-state.json
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run resolve

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshot
          path: failure.png
          if-no-files-found: ignore
