name: Daily livestream URL to Firebase

# Explicit permissions help scheduled runs on repos with restrictive defaults.
permissions:
  contents: read

'on':
  workflow_dispatch:
  schedule:
    # Multiple UTC slots ≈ 5:00–9:50 IST to survive GitHub schedule jitter (free tier).
    # IST = UTC+5:30
    - cron: '30 23 * * *' # ~05:00 IST
    - cron: '15 0 * * *' # ~05:45 IST
    - cron: '0 1 * * *' # ~06:30 IST
    - cron: '45 1 * * *' # ~07:15 IST
    - cron: '30 2 * * *' # ~08:00 IST
    - cron: '15 3 * * *' # ~08:45 IST
    - cron: '0 4 * * *' # ~09:30 IST
    - cron: '20 4 * * *' # ~09:50 IST

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Show trigger info
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: IST calendar date (cache key)
        id: istday
        run: echo "d=$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day state
        uses: actions/cache@v4
        with:
          path: livestream-state.json
          key: livestream-notify-${{ steps.istday.outputs.d }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Setup Firebase credentials
        run: |
          cat > service-account-key.json << 'CREDEOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CREDEOF

      - name: Run livestream detector
        run: npm run resolve
        env:
          START_URL: ${{ secrets.START_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Cache state for later runs
        uses: actions/cache@v4
        if: always()
        with:
          path: livestream-state.json
          key: livestream-notify-${{ steps.istday.outputs.d }}
