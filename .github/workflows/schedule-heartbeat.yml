name: Schedule heartbeat (GitHub cron check)

# Minimal workflow to confirm scheduled events are delivered to this repo.
# If this never runs, the issue is GitHub scheduling/settings (not Playwright).
permissions:
  contents: read

'on':
  schedule:
    # 06:52 IST == 01:22 UTC (a few minutes before the main 07:00 IST job)
    - cron: '22 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduled tick
        run: |
          echo "heartbeat ok"
          echo "event_name=${{ github.event_name }}"
